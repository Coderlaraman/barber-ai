version: '3.8'

services:
  ai-recommender-service:
    build: .
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
    depends_on:
      - redis
    networks:
      - barber-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - barber-network

networks:
  barber-network:
    driver: bridge