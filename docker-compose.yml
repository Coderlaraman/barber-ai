services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: barber
      DB_PASSWORD: barber
      DB_NAME: barber
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh
      JWT_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      PORT: "3002"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8085"
      AUTH_SERVICE_URL: http://auth-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      ranking-service:
        condition: service_healthy
      ai-recommender-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://barber:barber@postgres:5432/barber
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/scheduler/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3003"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/notifications/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3004"
      DATABASE_URL: postgres://barber:barber@postgres:5432/barber
      STORAGE_PROVIDER: s3
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/portfolio/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3005"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/search/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ranking-service:
    build:
      context: .
      dockerfile: services/ranking-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3006"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/ranking/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ai-recommender-service:
    build:
      context: ./services/ai-recommender-service
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata: