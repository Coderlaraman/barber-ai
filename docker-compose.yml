services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: barber
      DB_PASSWORD: barber
      DB_NAME: barber
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh
      JWT_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      - auth-service
      - scheduler-service
      - notifications-service
      - portfolio-service
      - search-service
      - ranking-service
    ports:
      - "8080:8080"
  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://barber:barber@postgres:5432/barber
    depends_on:
      - redis
      - postgres
    expose:
      - "3002"
  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3003"
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "3003"
  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3004"
      DATABASE_URL: postgres://barber:barber@postgres:5432/barber
      STORAGE_PROVIDER: s3
    depends_on:
      - postgres
    expose:
      - "3004"
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3005"
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "3005"
  ranking-service:
    build:
      context: .
      dockerfile: services/ranking-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3006"
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "3006"
  ai-recommender-service:
    build:
      context: ./services/ai-recommender-service
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
volumes:
  pgdata: